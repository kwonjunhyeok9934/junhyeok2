# Supabase 무료 플랜은 일주일 동안 요청이 없으면 프로젝트를 자동으로 일시정지한다.
# 그러면 앱 로그인부터 막히므로, 하루 한 번 가벼운 요청을 보내 "사용 중"으로 유지한다.
# 접속 정보는 js/config.js 한 곳에서만 읽는다 (프로젝트를 옮기면 그 파일만 고치면 된다).
name: Supabase 깨워두기

on:
  schedule:
    - cron: '17 3 * * *' # 매일 12:17 (한국 시간)
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 에 요청 보내기
        run: |
          set -euo pipefail

          URL=$(sed -n "s/^export const SUPABASE_URL *= *'\([^']*\)'.*/\1/p" js/config.js)
          KEY=$(sed -n "s/^export const SUPABASE_ANON_KEY *= *'\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::js/config.js 에서 SUPABASE_URL / SUPABASE_ANON_KEY 를 읽지 못했습니다."
            exit 1
          fi
          echo "대상: $URL"

          # 앱과 똑같은 형태의 조회. RLS 때문에 결과는 빈 배열이지만,
          # 요청이 Postgres 까지 닿기 때문에 활동으로 기록된다.
          BODY=$(mktemp)
          code=""
          for i in 1 2 3; do
            : > "$BODY"
            code=$(curl -sS -m 30 -o "$BODY" -w '%{http_code}' \
              "$URL/rest/v1/categories?select=id&limit=1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY") && break
            code=""
            if [ "$i" -lt 3 ]; then
              echo "연결 실패 ($i/3) — 15초 후 다시 시도"
              sleep 15
            else
              echo "연결 실패 (3/3) — 포기"
            fi
          done

          echo "응답 코드: ${code:-연결 실패}"
          echo "응답 내용: $(head -c 300 "$BODY")"

          # 2xx 든 4xx 든 서버가 대답했다면 깨어 있는 것이다.
          # 응답이 아예 없거나 5xx 면 일시정지·장애를 의심한다.
          case "${code:-000}" in
            2* | 4*)
              echo "정상 — 프로젝트가 깨어 있습니다."
              ;;
            *)
              echo "::error::Supabase 가 정상 응답하지 않습니다 (HTTP ${code:-연결 실패}). 프로젝트가 일시정지됐을 수 있어요. https://supabase.com/dashboard 에서 상태를 확인하고 Restore 를 눌러 주세요."
              exit 1
              ;;
          esac
