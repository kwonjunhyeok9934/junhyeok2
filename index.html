<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <title>우리집</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/app.css">
  <style>#splash{position:fixed;inset:0;z-index:100;background:#3182f6}</style>
</head>
<body>

<!-- 시작 스플래시: 집이 떠오른 뒤 커지며 앱으로 이어진다 -->
<div id="splash" aria-hidden="true">
  <svg class="logo" viewBox="0 0 100 100"><path d="M50 20 L13 52 H24 V82 H43 V60 H57 V82 H76 V52 H87 Z"/></svg>
</div>

<!-- Supabase 설정이 비어 있을 때 -->
<section id="setup-notice" class="center-box" hidden>
  <h1>설정이 필요해요</h1>
  <p><code>js/config.js</code>에 Supabase URL과 키를 넣어 주세요.</p>
</section>

<!-- 로그인 -->
<section id="view-login" class="center-box" hidden>
  <div class="brand">
    <svg viewBox="0 0 100 100"><path d="M50 20 L13 52 H24 V82 H43 V60 H57 V82 H76 V52 H87 Z"/></svg>
    <h1>우리집</h1>
    <p>둘이 함께 쓰는 가계부 · 할일 · 스케줄</p>
  </div>
  <form id="login-form" autocomplete="on">
    <label>이메일
      <input id="login-email" type="email" autocomplete="username" required>
    </label>
    <label>비밀번호
      <input id="login-password" type="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden>이메일 또는 비밀번호가 틀렸어요</p>
    <button type="submit" class="btn primary wide">로그인</button>
  </form>
</section>

<!-- 메인 -->
<div id="view-main" hidden>
  <header class="topbar">
    <h1 id="page-title">가계부</h1>
    <button id="btn-settings" class="icon-btn" aria-label="설정">⚙</button>
  </header>

  <main>
    <section id="tab-ledger" class="tab">
      <div class="month-nav">
        <button id="month-prev" class="icon-btn" aria-label="이전 달">◀</button>
        <span id="month-label"></span>
        <button id="month-next" class="icon-btn" aria-label="다음 달">▶</button>
      </div>
      <div class="range-row"><button type="button" id="range-btn" class="pill">1개월 ▾</button></div>

      <div class="summary">
        <div class="sum-item"><span class="sum-label">수입</span><strong id="sum-income" class="income">0</strong></div>
        <div class="sum-item"><span class="sum-label">지출</span><strong id="sum-expense">0</strong></div>
        <div class="sum-item"><span class="sum-label">남은 돈</span><strong id="sum-balance">0</strong></div>
      </div>

      <details id="cat-totals" class="card">
        <summary>카테고리별 지출</summary>
        <ul id="cat-totals-list" class="plain-list"></ul>
      </details>

      <div id="tx-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

    </section>

    <section id="tab-todo" class="tab" hidden>
      <form id="todo-quick" class="row quick">
        <input id="todo-quick-title" type="text" placeholder="할일을 적고 Enter" maxlength="80" autocomplete="off">
        <button type="submit" class="btn primary small">추가</button>
      </form>

      <div id="todo-list"><div class="skel"></div><div class="skel"></div></div>

      <details id="todo-done" class="card" hidden>
        <summary>완료됨 <span id="todo-done-count">0</span></summary>
        <div id="todo-done-list"></div>
        <button type="button" id="todo-clear-done" class="btn small danger" style="margin-top:8px">완료 모두 삭제</button>
      </details>
    </section>

    <section id="tab-schedule" class="tab" hidden>
      <div class="month-nav">
        <button id="cal-prev" class="icon-btn" aria-label="이전 달">◀</button>
        <span id="cal-label"></span>
        <button id="cal-next" class="icon-btn" aria-label="다음 달">▶</button>
      </div>
      <div class="cal-head"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
      <div id="cal-grid" class="cal-grid"></div>
      <h2 id="day-label" class="day-label"></h2>
      <div id="event-list"><div class="skel"></div></div>
    </section>
  </main>

  <button id="btn-add" class="fab" aria-label="추가">＋</button>

  <nav class="tabbar">
    <a href="#ledger" data-tab="ledger" class="active"><span class="tab-icon">₩</span>가계부</a>
    <a href="#todo" data-tab="todo"><span class="tab-icon">✓</span>할일</a>
    <a href="#schedule" data-tab="schedule"><span class="tab-icon">📅</span>스케줄</a>
  </nav>
</div>

<!-- 거래 입력 시트 -->
<div id="sheet-tx" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <form id="tx-form">
      <input type="hidden" id="tx-id">

      <div class="seg">
        <label><input type="radio" name="kind" value="expense" checked><span>지출</span></label>
        <label><input type="radio" name="kind" value="income"><span>수입</span></label>
      </div>

      <label class="amount-field">
        <span class="won">₩</span>
        <input id="tx-amount" type="text" inputmode="numeric" placeholder="0" autocomplete="off">
      </label>

      <div id="tx-cats" class="chips"></div>
      <div id="tx-new-cat-row" class="row" hidden>
        <input id="tx-new-cat" type="text" placeholder="새 카테고리 이름" maxlength="20">
        <button type="button" id="tx-new-cat-ok" class="btn small">추가</button>
      </div>

      <div class="row">
        <input id="tx-date" type="date" required>
        <input id="tx-memo" type="text" placeholder="메모 (선택)" maxlength="60">
      </div>

      <div class="row actions">
        <button type="button" id="tx-delete" class="btn danger" hidden>삭제</button>
        <button type="submit" id="tx-save" class="btn primary grow" disabled>저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 조회 기간 시트 -->
<div id="sheet-range" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <form id="range-form">
      <div class="field-label">조회 기간</div>
      <div id="range-presets" class="chips">
        <button type="button" class="chip" data-span="1">1개월</button>
        <button type="button" class="chip" data-span="3">3개월</button>
        <button type="button" class="chip" data-span="6">6개월</button>
        <button type="button" class="chip" data-span="12">1년</button>
      </div>
      <div class="field-label" style="margin-top:6px">직접 지정</div>
      <div class="row">
        <input id="range-start" type="date">
        <span class="muted">~</span>
        <input id="range-end" type="date">
      </div>
      <button type="submit" id="range-apply" class="btn primary wide">이 기간으로 보기</button>
    </form>
  </div>
</div>

<!-- 할일 편집 시트 -->
<div id="sheet-todo" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <form id="todo-form">
      <input type="hidden" id="todo-id">
      <input id="todo-title" type="text" placeholder="할일" maxlength="80" required>
      <div>
        <div class="field-label">담당</div>
        <div id="todo-assignee" class="seg"></div>
      </div>
      <div>
        <div class="field-label">마감일</div>
        <div class="row">
          <input id="todo-due" type="date">
          <button type="button" id="todo-due-clear" class="btn small">없음</button>
        </div>
      </div>
      <div class="row actions">
        <button type="button" id="todo-delete" class="btn danger">삭제</button>
        <button type="submit" id="todo-save" class="btn primary grow">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 일정 시트 -->
<div id="sheet-event" class="sheet" aria-hidden="true">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <form id="event-form">
      <input type="hidden" id="event-id">
      <input id="event-title" type="text" placeholder="일정" maxlength="80" required>
      <div class="row">
        <input id="event-date" type="date" required>
        <input id="event-time" type="time">
        <button type="button" id="event-allday" class="btn small">종일</button>
      </div>
      <div>
        <div class="field-label">누구</div>
        <div id="event-owner" class="seg"></div>
      </div>
      <input id="event-memo" type="text" placeholder="메모 (선택)" maxlength="120">
      <div class="row actions">
        <button type="button" id="event-delete" class="btn danger" hidden>삭제</button>
        <button type="submit" id="event-save" class="btn primary grow" disabled>저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 설정 -->
<div id="view-settings" class="overlay" hidden>
  <header class="topbar">
    <button id="settings-close" class="icon-btn" aria-label="닫기">←</button>
    <h1>설정</h1>
  </header>
  <main class="settings-body">
    <section class="card">
      <h2>내 이름</h2>
      <div class="row">
        <input id="my-name" type="text" maxlength="10" placeholder="표시할 이름">
        <button id="my-name-save" class="btn small">저장</button>
      </div>
      <p class="hint">거래 옆에 첫 글자가 표시돼요.</p>
    </section>

    <section class="card">
      <h2>카테고리</h2>
      <div id="cat-manage"></div>
    </section>

    <button id="btn-logout" class="btn wide">로그아웃</button>
  </main>
</div>

<div id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
